allprojects {
    repositories {
        google()
        mavenCentral()
        // Only QuickJS for Mihon extensions (the fork Mihon uses).
        maven {
            url "https://jitpack.io"
            content { includeGroup "com.github.zhanghai.quickjs-java" }
        }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// flutter_js pins Kotlin's jvmTarget to 1.8 but leaves Java on AGP's default
// (11), which Gradle rejects. Align Java with Kotlin for that plugin only.
subprojects {
    if (project.name == 'flutter_js') {
        project.plugins.withId('com.android.library') {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
    }
}
// flutter_avif_android ships its plugin class twice, in Java and in Kotlin,
// and applies no Kotlin plugin, so only the Java one is meant to build. The
// Flutter Gradle plugin applies Kotlin to every plugin, which then compiles
// both (a redeclaration) and targets the JDK running Gradle while Java stays
// on 11 (an inconsistent JVM target). Skip the Kotlin copy and align the
// target. Its compileSdk (31) is also older than its AndroidX dependencies
// accept, so it compiles against the app's.
subprojects {
    if (project.name == 'flutter_avif_android') {
        project.afterEvaluate {
            project.android.compileSdkVersion rootProject.project(':app').android.compileSdkVersion
        }
        project.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach {
            it.exclude('**/FlutterAvifPlugin.kt')
            it.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
