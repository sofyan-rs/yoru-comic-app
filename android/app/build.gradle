plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// A store build (--dart-define=STORE_BUILD=true, see AppVariables.storeBuild)
// leaves out the permission to install APKs: Google Play allows it only for
// apps whose core purpose needs it, and the store updates the app. Flutter
// passes the dart-defines to Gradle base64-encoded and comma-separated.
def storeBuild = ((project.findProperty('dart-defines') ?: '') as String)
        .split(',')
        .findAll { it }
        .any { new String(it.decodeBase64(), 'UTF-8') == 'STORE_BUILD=true' }

android {
    namespace "org.kurodev.yoru"
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        // Required by ota_update.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "org.kurodev.yoru"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        manifestPlaceholders = [appLabel: "Yoru"]
        ndk {
            debugSymbolLevel 'FULL'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    if (storeBuild) {
        // A build type's manifest merges over main and the libraries', so
        // its tools:node="remove" also drops ota_update's copy.
        ['debug', 'profile', 'release'].each {
            sourceSets[it].manifest.srcFile 'src/store/AndroidManifest.xml'
        }
    }
    // The Mihon host (loading extension APKs) and the APK self-update are
    // left out of a store build entirely, not only switched off: stores
    // forbid running downloaded native code and updating outside the store.
    // src/full holds the real glue, src/store no-op stand-ins.
    sourceSets.main.java.srcDirs += storeBuild ? 'src/store/kotlin' : 'src/full/kotlin'

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        // Debug and profile builds install next to the released app, so
        // trying one on a phone never replaces it (a different signature
        // would make Flutter uninstall it, data and all). Their ".dev"
        // application ID is set below.
        debug {
            manifestPlaceholders = [appLabel: "Yoru Dev"]
        }
        profile {
            manifestPlaceholders = [appLabel: "Yoru Dev"]
        }
    }
}

// The ".dev" suffix is set on the variants rather than with
// applicationIdSuffix in buildTypes. The Flutter Gradle plugin copies the
// app's build types onto plugin library projects, and AGP fails the build
// when a library build type sets applicationIdSuffix.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType in ["debug", "profile"]) {
            variant.applicationId.set("${android.defaultConfig.applicationId}.dev")
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

if (storeBuild) {
    // ota_update's plugin project is added by the Flutter Gradle plugin;
    // dropping it here leaves GeneratedPluginRegistrant with the no-op
    // OtaUpdatePlugin in src/store (Dart never calls it: no update check).
    configurations.configureEach {
        exclude group: 'sk.fourq.otaupdate', module: 'ota_update'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    if (!storeBuild) implementation project(':mihon')
}
